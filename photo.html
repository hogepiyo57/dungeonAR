<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダンジョン撮影</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  /* 写真は画面に収まる最大の大きさで表示（縦横比は保つ） */
  .stage { position: relative; width: 100%; display: flex; justify-content: center; flex: none; }
  .stage canvas {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: calc(100dvh - 150px); /* 縦向き：下のシャッター列が必ず見えるように */
    background: #000;
    touch-action: none;
  }
  .panel { width: 100%; max-width: 1100px; margin: 0 auto; padding: 12px 16px 24px; display: grid; gap: 12px; align-content: start; }
  .bar { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .golem-bar[hidden], .battle-fields[hidden], #nameField[hidden] { display: none; }
  #autoFit { font-size: 14px; min-height: 36px; padding: 6px 12px; }
  #autoFit[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  /* 戦闘画面のてき入力 */
  .battle-fields { display: grid; gap: 6px; }
  .enemy-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 6px; }
  .enemy-row input, .enemy-row select {
    font: inherit; font-size: 16px; color: var(--text); background: #111;
    border: 2px solid #666; border-radius: 6px; padding: 8px; min-width: 0; width: 100%;
  }
  .settings { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-width: 0; }
  .settings select, .settings input[type="text"] { width: 100%; min-width: 0; }
  .settings .full { grid-column: 1 / -1; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .toggles label { display: flex; align-items: center; gap: 6px; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }

  /* 横向き（タブレット・スマホ）：写真を左に画面の高さいっぱいで、操作パネルを右に並べる */
  @media (orientation: landscape) {
    html, body { overflow: hidden; }
    body { flex-direction: row; height: 100dvh; }
    .stage { flex: 1; min-width: 0; height: 100dvh; align-items: center; }
    .stage canvas { max-height: 100dvh; }
    .panel { width: 320px; flex: none; height: 100dvh; overflow-y: auto; overflow-x: hidden; padding: 12px; }
    .settings { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="view" width="1536" height="1024" aria-label="合成プレビュー"></canvas>
</div>

<div class="panel">
  <div class="bar">
    <div class="camsel" id="camsel" role="group" aria-label="カメラ">
      <button type="button" data-facing="user">イン</button>
      <button type="button" data-facing="environment">アウト</button>
    </div>
    <button class="shutter" id="shoot" type="button" aria-label="撮影" disabled></button>
    <button class="btn" id="msgNext" type="button">セリフ変更</button>
  </div>
  <div class="bar golem-bar" id="golemBar" hidden>
    <button class="btn primary" id="summon" type="button">しょうかん</button>
    <button class="btn" id="attack" type="button">こうげき</button>
  </div>
  <div class="bar"><button class="btn" id="autoFit" type="button" aria-pressed="true">立ち位置：自動</button></div>
  <p class="hint"><a href="index.html">◀ もどる</a>　人物は自動で立ち位置に合わせます。画面をドラッグすると手動で動かせます（ピンチまたは「大きさ」で拡大・縮小）</p>

  <div class="settings win">
    <label class="field full" id="nameField">なまえ（ステータスとセリフに入ります）
      <input type="text" id="name" maxlength="8" placeholder="ゆうしゃ">
    </label>
    <label class="field full">ばしょ
      <select id="scene">
        <option value="hall">大広間（3Dゴーレムが出現）</option>
        <option value="magic">魔法陣の間（光る魔法陣の上に立つ）</option>
        <option value="battle">戦闘画面（自分がモンスターになる）</option>
        <option value="golem">ゴーレムの間（絵のゴーレム）</option>
      </select>
    </label>
    <div class="full battle-fields" id="battleFields" hidden>
      <div class="field">てき（名前と数。空欄の行は表示しません）</div>
      <div class="enemy-row">
        <input type="text" class="enemy-name" maxlength="10" value="てきA" aria-label="てき1の名前">
        <select class="enemy-count" aria-label="てき1の数"></select>
      </div>
      <div class="enemy-row">
        <input type="text" class="enemy-name" maxlength="10" value="てきB" aria-label="てき2の名前">
        <select class="enemy-count" aria-label="てき2の数"></select>
      </div>
      <div class="enemy-row">
        <input type="text" class="enemy-name" maxlength="10" value="" placeholder="（なし）" aria-label="てき3の名前">
        <select class="enemy-count" aria-label="てき3の数"></select>
      </div>
    </div>
    <label class="field">大きさ
      <input type="range" id="scale" min="0.4" max="1.6" step="0.01" value="1">
    </label>
    <label class="field">タイマー
      <select id="timer">
        <option value="0">なし</option>
        <option value="3" selected>3秒</option>
        <option value="5">5秒</option>
      </select>
    </label>
    <label class="field">ドット絵化
      <select id="pixel">
        <option value="0">なし</option>
        <option value="7" selected>ふつう</option>
        <option value="10">粗い</option>
        <option value="14">とても粗い</option>
      </select>
    </label>
    <div class="toggles full">
      <label><input type="checkbox" id="hudStatus" checked> ステータス</label>
      <label><input type="checkbox" id="hudMessage" checked> メッセージ</label>
      <label><input type="checkbox" id="embers" checked> 光の粒・火の粉</label>
      <label><input type="checkbox" id="chest" checked> 宝箱</label>
      <label><input type="checkbox" id="sound" checked> おと</label>
    </div>
  </div>
</div>

<div class="overlay-msg" id="loading">
  <div class="win"><h2>じゅんびちゅう…</h2><p id="loadingText">カメラと人物切り抜きAIを読み込んでいます。カメラの許可を求められたら「許可」を押してください。</p></div>
</div>

<div class="countdown" id="countdown" hidden></div>
<div class="flash" id="flash"></div>

<div class="result" id="result" hidden>
  <img alt="撮影した写真">
  <div class="row">
    <button class="btn primary" data-act="share" type="button">写真に保存・共有</button>
    <button class="btn" data-act="download" type="button">ダウンロード</button>
    <button class="btn" data-act="close" type="button">もう一度とる</button>
  </div>
  <p>うまく保存できないときは、画像を長押しして「写真に追加」を選んでください</p>
</div>

<video id="video" playsinline muted autoplay style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<script type="module" src="js/pages/photo.js"></script>
</body>
</html>
