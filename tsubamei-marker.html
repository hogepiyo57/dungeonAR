<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つばめいARポスター印刷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 16px; }
  .guide { max-width: 760px; margin: 0 auto 16px; }
  .guide ol { padding-left: 1.4em; margin: 6px 0; }
  .poster { max-width: 640px; margin: 0 auto; }
  .poster img { display: block; width: 100%; height: auto; }
  /* A4縦に、余白なしでいっぱいに印刷する */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; }
    .guide, .back { display: none; }
    .poster { max-width: none; width: 210mm; }
    .poster img { width: 210mm; height: 297mm; object-fit: contain; }
  }
</style>
</head>
<body>
<a class="btn back" href="index.html">◀ もどる</a>

<div class="guide win" style="margin-top:48px">
  <h2>つばめいARポスターの作り方</h2>
  <ol>
    <li>この画面を印刷します（A4縦）。A3縦に拡大印刷すると、離れても認識しやすくなります。</li>
    <li>絵は切らずに、そのまま壁に貼るか、床・机に置きます。光が反射しないよう、つや消しの紙がおすすめです。</li>
    <li>「つばめいを よびだす」でポスター全体をうつすと、実物大（1m20cm）のつばめいが出てきます。</li>
    <li>はじめに「せってい」で、印刷した横幅（A4縦＝21cm、A3縦＝29.7cm）と、壁に貼ったときの下のふちの高さ（床から）を入れてください。この端末に記憶されます。</li>
  </ol>
  <p>
    <button class="btn primary" type="button" onclick="print()">印刷する</button>
    <a class="btn" href="assets/tsubamei-poster.png" download="tsubamei-poster.png">画像をダウンロード</a>
  </p>
</div>

<div class="poster">
  <img src="assets/tsubamei-poster.png" alt="つばめいのARポスター">
</div>
</body>
</html>
