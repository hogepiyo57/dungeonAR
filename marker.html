<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARポスター印刷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 16px; }
  .guide { max-width: 760px; margin: 0 auto 16px; }
  .guide ol { padding-left: 1.4em; margin: 6px 0; }
  .poster { max-width: 1100px; margin: 0 auto; background: #fff; padding: 2%; }
  .poster img { display: block; width: 100%; height: auto; }
  .poster p { margin: 1.2% 0 0; color: #111; text-align: center; font-size: 20px; }
  @page { size: A4 landscape; margin: 8mm; }
  @media print {
    body { background: #fff; padding: 0; }
    .guide, .back { display: none; }
    .poster { max-width: none; padding: 0; }
  }
</style>
</head>
<body>
<a class="btn back" href="index.html">◀ もどる</a>

<div class="guide win" style="margin-top:48px">
  <h2>ARポスターの作り方</h2>
  <ol>
    <li>この画面を印刷します（A4横。A3以上に拡大印刷すると、離れても認識しやすくなります）。</li>
    <li>絵の部分は切らずに、そのまま壁に貼ります。光が反射しないよう、つや消しの紙がおすすめです。</li>
    <li>「ゴーレムを しょうかんする」でポスター全体をうつすと、ゴーレムが出現します。</li>
  </ol>
  <p><button class="btn primary" type="button" onclick="print()">印刷する</button></p>
</div>

<div class="poster">
  <img src="assets/dungeon.jpg" alt="ARマーカーになるダンジョンの絵">
  <p>スマホでうつすと ゴーレムが あらわれる！</p>
</div>
</body>
</html>
